name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_versioned:
        description: "Publish this build as a numbered versioned release"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Install build tools
        run: |
          brew update
          brew install ldid
          # Pin xcodegen: latest writes objectVersion 77 which the runner's
          # Xcode cannot open.
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.40.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo cp /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen --version

      - name: Fetch and patch Go dependencies (go-gost/x with iOS ICMP patch)
        run: ./scripts/fetch-deps.sh

      - name: Build Go engine (wireguard-go + gost sidecar) for iOS
        run: ./scripts/build-go-framework.sh

      - name: Generate Xcode project
        working-directory: project
        run: xcodegen generate

      - name: Build app (unsigned, device)
        working-directory: project
        run: |
          if ! xcodebuild \
            -project GostWG.xcodeproj \
            -scheme GostWG \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" > xcodebuild.log 2>&1; then
            tail -n 100 xcodebuild.log
            exit 1
          fi
          grep -E "error:|BUILD" xcodebuild.log || true
          test -d .build/Build/Products/Release-iphoneos/GostWG.app
          test -f .build/Build/Products/Release-iphoneos/GostWG.app/GostWG

      - name: Fake-sign (with entitlements) and package IPA
        run: |
          APP="project/.build/Build/Products/Release-iphoneos/GostWG.app"
          # Embed the NetworkExtension entitlements with an ldid fake signature.
          # TrollStore keeps these entitlements; Sideloadly/AltStore re-sign with
          # a real identity anyway.
          ldid -S"$PWD/project/GostWG/GostWG.entitlements" "$APP/GostWG"
          ldid -S"$PWD/project/Tunnel/GostWGTunnel.entitlements" "$APP/PlugIns/GostWGTunnel.appex/GostWGTunnel"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr GostWG-unsigned.ipa Payload
          ls -la GostWG-unsigned.ipa

      - name: Verify IPA structure
        run: |
          unzip -l GostWG-unsigned.ipa | head -12
          unzip -l GostWG-unsigned.ipa | grep -q 'Payload/GostWG.app/$' || { echo 'ERROR: Payload/GostWG.app missing'; exit 1; }
          unzip -l GostWG-unsigned.ipa | grep -q 'Payload/GostWG.app/PlugIns/GostWGTunnel.appex/' || { echo 'ERROR: tunnel extension missing'; exit 1; }
          echo 'IPA structure OK'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GostWG-unsigned-ipa
          path: GostWG-unsigned.ipa
          if-no-files-found: error

      - name: Publish numbered release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_versioned == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*MARKETING_VERSION: "\([^"]*\)".*/\1/p' project/project.yml | head -n 1)
          BUILD=$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION: "\([^"]*\)".*/\1/p' project/project.yml | head -n 1)
          test -n "$VERSION" || { echo 'ERROR: MARKETING_VERSION is missing'; exit 1; }
          test -n "$BUILD" || { echo 'ERROR: CURRENT_PROJECT_VERSION is missing'; exit 1; }
          TAG="v$VERSION"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "GostWG $TAG" \
              --notes "GostWG $TAG (build $BUILD). Includes persistent tunnel logs for fast disconnect diagnosis."
          gh release upload "$TAG" GostWG-unsigned.ipa --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attach IPA to "latest" release
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.publish_versioned != true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest --repo "$GITHUB_REPOSITORY" --title "Latest unsigned IPA" --notes "Latest successful CI build (unsigned; install via TrollStore or re-sign)."
          gh release upload latest GostWG-unsigned.ipa --repo "$GITHUB_REPOSITORY" --clobber
